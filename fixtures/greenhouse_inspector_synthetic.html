<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Synthetic Application - Example Corp</title></head>
<body>
<!-- Synthetic page that imitates the STRUCTURE of a Greenhouse application form.
     No real employer, person, or data. Used to verify the read-only form inspector. -->
<form id="application-form" action="#" onsubmit="return false">
  <input type="hidden" id="job_application_token" name="job_application[token]" value="SECRET-HIDDEN-VALUE">

  <div><label for="first_name">First Name*</label>
       <input id="first_name" name="first_name" type="text" required value="SECRET-TYPED-VALUE"></div>
  <div><label for="last_name">Last Name*</label>
       <input id="last_name" name="last_name" type="text" required></div>
  <div><label for="email">Email*</label>
       <input id="email" name="email" type="email" required autocomplete="email"></div>

  <div><label id="country-label" for="country">Country*</label>
       <input id="country" role="combobox" aria-haspopup="listbox" aria-labelledby="country-label" aria-required="true" type="text"></div>
  <div><label for="phone">Phone*</label>
       <input id="phone" name="phone" type="tel" required></div>
  <div><label id="loc-label" for="candidate-location">Location (City)*</label>
       <input id="candidate-location" role="combobox" aria-haspopup="listbox" aria-labelledby="loc-label" aria-required="true" type="text"></div>

  <div role="group" aria-labelledby="resume-label">
    <span id="resume-label">Resume/CV*</span>
    <input id="resume" type="file" accept=".pdf,.doc,.docx" required>
  </div>

  <div><label id="school-label" for="school--0">School*</label>
       <input id="school--0" role="combobox" aria-haspopup="listbox" aria-labelledby="school-label" aria-required="true" type="text"></div>
  <div><label id="degree-label" for="degree--0">Degree*</label>
       <input id="degree--0" role="combobox" aria-haspopup="listbox" aria-labelledby="degree-label" aria-required="true" type="text"></div>
  <div><label id="disc-label" for="discipline--0">Discipline*</label>
       <input id="discipline--0" role="combobox" aria-haspopup="listbox" aria-labelledby="disc-label" aria-required="true" type="text"></div>
  <div><label for="start-year--0">Start date year*</label>
       <input id="start-year--0" type="number" required></div>

  <div><label for="question_1001">LinkedIn Profile</label>
       <input id="question_1001" name="question_1001" type="text"></div>
  <div><label for="question_1002">Are you legally authorized to work in the United States?*</label>
       <select id="question_1002" name="question_1002" required>
         <option value="">Select...</option><option value="1">Yes</option><option value="2">No</option>
       </select></div>
  <fieldset>
    <legend>Will you now or in the future require sponsorship?*</legend>
    <label><input id="question_1003_yes" name="question_1003" type="radio" value="1" required> Yes</label>
    <label><input id="question_1003_no" name="question_1003" type="radio" value="0"> No</label>
  </fieldset>
  <div><label for="question_1004">Why are you interested in this role?*</label>
       <textarea id="question_1004" name="question_1004" required maxlength="1500"></textarea></div>
  <div><label><input id="question_1005[]_5001" name="question_1005[]" type="checkbox" value="5001" required>
       I acknowledge the Privacy Policy and consent to processing of my data.</label></div>

  <div><label id="gender-label" for="963">Gender</label>
       <input id="963" role="combobox" aria-haspopup="listbox" aria-labelledby="gender-label" type="text"></div>

  <div><label for="disabled_probe">Disabled probe</label><input id="disabled_probe" type="text" disabled></div>
  <div style="display:none"><label for="hidden_probe">Not visible</label><input id="hidden_probe" type="text"></div>
  <input type="text" id="mystery_field">

  <button type="submit" id="submit_app">Submit application</button>
</form>
</body>
</html>
